<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B3D2E"><title>Updating LSO Permissions</title><style>body{font-family:system-ui,sans-serif;background:#0b3d2e;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}.card{max-width:560px;text-align:center;background:#fff;color:#17211d;padding:32px;border-radius:24px}.spinner{width:44px;height:44px;margin:0 auto 18px;border:5px solid #d8e2dc;border-top-color:#146c43;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="card"><div class="spinner"></div><h1>Updating Role Permissions</h1><p>Removing old website caches and loading the Administrator-controlled permission center.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('lso-website-')).map(k=>caches.delete(k)))}}catch(e){}location.replace('./index.html?role-permissions=v38&ts='+Date.now())})()</script></body></html>
