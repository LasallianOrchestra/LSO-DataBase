  .mp-summary-head span { font-size:7px; background: rgba(255,255,255,0.18); padding: 1mm 2.5mm; border-radius:999px; white-space:nowrap; }
  .mp-table { width:100%; border-collapse: collapse; font-size: 7.2px; }
  .mp-table th, .mp-table td { border: 0.5pt solid #9db8ad; }
  .mp-table thead th { background:#0b3d2e; color:#fff; font-size:6.6px; text-transform:uppercase; letter-spacing:0.05em; padding: 2.2mm 2mm; text-align:left; white-space:nowrap; }

    .lso-print-content { margin: 1.30in 0.60in 1.05in 0.60in; padding:0; }
    .mp-table .sel-col { display:none; }
    .mp-table tbody tr.row-unselected { display:none; }
  }

  @media (max-width: 920px) {
    .preview-stage { padding: 8px; }
    .lso-print-document { width: 100%; max-width: 8.5in; }
  }

};

function safeText(v){ return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function dateLabel(v){ if(!v) return '—'; const d=new Date(v+'T00:00:00'); if(isNaN(d)) return v; return new Intl.DateTimeFormat('en-PH',{year:'numeric',month:'short',day:'numeric'}).format(d); }

function memberRecordTable(member, i){
  const sections = [
    { name:'Personal Information', no:'01', rows:[
      ['Full Name', member.fullName],
      ['Membership ID', member.membershipId],
      ['Student Number', member.studentNumber],
      ['Age', member.age],
      ['Birthdate', dateLabel(member.birthdate)],
      ['Sex', member.sex],
      ['Home Address', member.homeAddress],
      ['DLSUD Outlook', member.outlook]
    ]},
    { name:'Academic Information', no:'02', rows:[
      ['College', member.college],
      ['Course', member.course],
      ['Year Level', member.yearLevel],
      ['Section', member.section],
      ['CYS', member.cys],
      ['Academic Status', member.academicStatus]
    ]},
    { name:'Organization Information', no:'03', rows:[
      ['Position in Organization', member.organizationPosition],
      ['Specific Organization Role', member.organizationRole],
      ['Member Status', member.memberStatus],
      ['Membership Stage', member.membershipStage],
      ['Current Period Group', member.periodGroup],
      ['Orchestra Section', member.orchestraSection],
      ['Primary Instrument', member.primaryInstrument],
      ['Stage Notes', member.stageNotes]
    ]},
    { name:'Membership Timeline', no:'04', rows:[
      ['Trainee Period Start', dateLabel(member.traineeStartDate)],
      ['Probationary Period Start', member.probationarySkipped ? 'Skipped' : dateLabel(member.probationaryStartDate)],
      ['Probationary Skipped', member.probationarySkipped ? 'Yes' : 'No'],
      ['Membership Period Start', dateLabel(member.regularMemberDate)],
      ['Date Registered', dateLabel(member.dateRegistered)],
      ['Last Profile Review', dateLabel(member.lastProfileReview)],
      ['Review Status', member.reviewStatus],
      ['Record Quality', member.recordQuality ? member.recordQuality+'%' : '—']
    ]},
    { name:'Record Notes', no:'05', rows:[
      ['Remarks / Notes', member.remarks]
    ]}
  ];

  const tablesHtml = sections.map(sec =>
    `<table class="mp-detail-table"><thead><tr><th colspan="2"><span class="mp-sec-no">${sec.no}</span>${safeText(sec.name)}</th></tr></thead><tbody>${
      sec.rows.map(([label, val]) => `<tr><th scope="row">${safeText(label)}</th><td>${safeText(val||'—')}</td></tr>`).join('')
    }</tbody></table>`
  ).join('');

  const badgeClass = member.periodGroup==='Membership Period' ? 'badge-green' : member.periodGroup==='Probationary Period' ? 'badge-gold' : 'badge-blue';
  const initials = String(member.fullName||'M').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();

  return `<article class="mp-card">
    <header class="mp-card-header">
      <div class="mp-card-identity">
        <div class="mp-avatar">${safeText(initials)}</div>
        <div class="mp-card-title">
          <h2>${safeText(member.fullName)}</h2>
          <p>${safeText(member.membershipId)} • ${safeText(member.studentNumber)} • ${safeText(member.orchestraSection)} • ${safeText(member.primaryInstrument)}</p>
          <div class="mp-badges">
            <span class="mp-badge ${badgeClass}">${safeText(member.periodGroup)}</span>
            <span class="mp-badge badge-gray">${safeText(member.memberStatus)}</span>
            <span class="mp-badge badge-gray">Quality: ${safeText(member.recordQuality)}%</span>
            <span class="mp-badge badge-gray">${safeText(member.organizationPosition)}${member.organizationRole ? ' • '+safeText(member.organizationRole) : ''}</span>
          </div>
        </div>
      </div>
      <div class="mp-card-index">#${String(i+1).padStart(3,'0')}</div>
    </header>
    <div class="mp-card-body">${tablesHtml}</div>
  </article>`;
}

function selectedMembers(stage){
  const members = sampleMembers[stage] || [];
  const sel = selectedByIndex[stage] || new Set();
  return members.filter((_, idx) => sel.has(idx));
}

function scopeLabel(stage){
  const total = (sampleMembers[stage]||[]).length;
  const count = selectedMembers(stage).length;
  return count === total
    ? `All Listed • ${count} record${count===1?'':'s'}`
    : `Selected Members • ${count} of ${total} listed`;
}

function renderStage(stage){
  currentStage = stage;
  const members = sampleMembers[stage] || [];
  const sel = selectedByIndex[stage] || new Set();
  const chosen = selectedMembers(stage);
  const today = new Date();
  const dateStr = new Intl.DateTimeFormat('en-PH',{year:'numeric',month:'long',day:'numeric'}).format(today);

  document.getElementById('selCount').textContent = `${chosen.length} selected`;
  document.getElementById('selTotal').textContent = `of ${members.length} listed • ${stage}`;
  document.getElementById('printBtn').disabled = chosen.length === 0;

  const summaryRows = members.map((m,i)=>{
    const isSel = sel.has(i);
    return `<tr class="${isSel?'':'row-unselected'}"><td class="sel-col"><input type="checkbox" data-idx="${i}" ${isSel?'checked':''} aria-label="Select ${safeText(m.fullName)}"></td><td class="c-index">${i+1}</td><td><strong>${safeText(m.fullName)}</strong><small>${safeText(m.membershipId)} • ${safeText(m.studentNumber)}</small></td><td>${safeText(m.orchestraSection)}<small>${safeText(m.primaryInstrument)}</small></td><td>${safeText(m.course||m.college)}<small>${safeText(m.yearLevel)} ${safeText(m.section)}</small></td><td>${safeText(m.organizationPosition)}<small>${safeText(m.organizationRole)}</small></td><td>${safeText(m.memberStatus)}</td><td class="c-index">${safeText(m.recordQuality)}%</td></tr>`;
  }).join('');

  document.getElementById('printContent').innerHTML = `
    <header class="mp-doc-head">
      <h1>LASALLIAN SYMPHONY ORCHESTRA</h1>
      <div class="mp-subtitle">Official Members Directory • ${safeText(stage)} • Portrait (8.5" x 13") Portrait</div>
      <div class="mp-meta">
        <span><strong>Generated:</strong> ${safeText(dateStr)}</span>
        <span><strong>By:</strong> Administrator</span>
        <span><strong>Records:</strong> ${chosen.length}</span>
        <span><strong>Paper:</strong> Portrait 8.5" x 13" Portrait</span>
      </div>
      <div class="mp-filters">
        <b>Print Scope:</b> ${safeText(scopeLabel(stage))}<br>
        <b>Filters Applied:</b> Search: None • Status: All • Orchestra Section: All • Position: All<br>
        <b>Coverage:</b> ${safeText(stage)} only • Sorted by Full Name (A-Z)<br>
        <b>Fields:</b> All information as indicated in System Management (Personal, Academic, Organization, Membership Timeline, Record Notes) including profile photo, quality score, and remarks.<br>
        <b>Paper Size:</b> Portrait 8.5" x 13" (215.9mm x 330.2mm) portrait — official LSO header (1.05in) &amp; footer (0.80in) on every page, safe content margins 1.30in top / 0.60in sides / 1.05in bottom
      </div>
      <div class="mp-note">This document uses the official LSO header (1.05in) and footer (0.80in). For professional output, enable <b>Background graphics</b> and set <b>Margins: None</b> in the browser print dialog. Unchecked rows are excluded from the detailed records and hidden when printing.</div>
    </header>

    <section class="mp-summary">
      <div class="mp-summary-head"><h3>Directory Summary • ${safeText(stage)}</h3><span>${chosen.length} of ${members.length} selected • Portrait Portrait</span></div>
      <div class="mp-table-wrap"><table class="mp-table"><thead><tr><th class="sel-col">✓</th><th class="c-index">#</th><th>Member / IDs</th><th>Section / Instrument</th><th>Program / Year</th><th>Organization</th><th>Status</th><th class="c-index">Quality</th></tr></thead><tbody>${summaryRows}</tbody></table></div>
    </section>

    <section class="mp-cards">
      ${chosen.map((m)=>memberRecordTable(m, members.indexOf(m))).join('') || '<div class="mp-summary"><div class="mp-summary-head"><h3>No records selected</h3><span>0</span></div><div style="padding:6mm; font-size:8px; color:#6c8079;">Tick at least one checkbox in the summary table above to include that member in the official document.</div></div>'}
    </section>

    <section class="mp-signatory">
      <div><div class="mp-sign-line"><strong>Juan Dela Cruz</strong><span>Prepared By / EVP for Membership</span></div></div>
      <div><div class="mp-sign-line"><strong></strong><span>Authorized Officer / President</span></div></div>
    </section>

    <div class="mp-print-meta">
      <b>Lasallian Symphony Orchestra</b> • Official Members Directory • ${safeText(stage)} • Generated ${safeText(dateStr)} • ${chosen.length} record${chosen.length===1?'':'s'}<br>
      This is a system-generated document containing all member information as indicated in System Management. Keep confidential.<br>
      Paper: Portrait (8.5" x 13" / 215.9mm x 330.2mm) Portrait • Official Header &amp; Footer • LSO Database System
    </div>
  `;

  document.querySelectorAll('#printContent .mp-table tbody input[type="checkbox"]').forEach(box=>{
    box.addEventListener('change', ()=>{
      const idx = Number(box.getAttribute('data-idx'));
      const set = selectedByIndex[currentStage];
      if (box.checked) set.add(idx); else set.delete(idx);
      renderStage(currentStage);
    });
  });

  document.querySelectorAll('.preview-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.stage===stage);
  });
}

function switchStage(stage){ renderStage(stage); }

function selectAll(on){
  const members = sampleMembers[currentStage] || [];
  selectedByIndex[currentStage] = new Set(on ? members.map((_, i)=>i) : []);
  renderStage(currentStage);
}

renderStage('Membership Period');
</script>

</body>
</html>
