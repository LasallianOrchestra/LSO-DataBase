  /* Screen preview wrapper */
  .screen-toolbar {
    position: sticky; top:0; z-index:200;

  }
  .screen-toolbar h1 { margin:0; font-size:16px; letter-spacing:-0.01em; }
  .screen-toolbar p { margin:2px 0 0; font-size:11px; color:#c9f5dc; }
  .screen-toolbar .actions { display:flex; gap:8px; flex-wrap:wrap; }

  .btn-secondary { background:rgba(255,255,255,0.12); color:#fff; border-color:rgba(255,255,255,0.22); }

  .preview-stage {
    padding: 18px; display:grid; place-items:start center; min-height: 100vh;
  }
  
  /* The actual print document - short bond */
  .lso-print-document {
    width: 8.5in; background:#fff; box-shadow: 0 18px 60px rgba(11,61,46,0.22);
    position:relative; overflow:hidden;
  }
  
  /* Fixed header/footer repeating on each printed page */
  .lso-print-header { position: relative; top:0; left:0; right:0; height: 0.92in; background:#fff; border-bottom: 1.2px solid #0b3d2e; overflow:hidden; }
  .lso-print-header img { width:100%; height:100%; object-fit: fill; display:block; }
  .lso-print-footer { position: relative; bottom:0; left:0; right:0; height: 0.62in; background:#fff; border-top: 0.8px solid #c7a547; overflow:hidden; margin-top: 6mm; }
  .lso-print-footer img { width:100%; height:100%; object-fit: fill; display:block; }
  
  .lso-print-content { padding: 6mm 0.52in 4mm 0.52in; }
  
  /* Document heading */
  .mp-doc-head { text-align:center; padding: 6mm 5mm 5mm; margin: 0 0 5mm; border: 1px solid #d7e7df; border-top: 3.5px solid #0b3d2e; border-bottom: 2px solid #c7a547; border-radius: 3mm; background: linear-gradient(180deg, #f7fbf9 0%, #ffffff 100%); }
  .mp-doc-head h1 { margin:0; font-size: 14.5px; color:#0b3d2e; letter-spacing: -0.01em; line-height:1.2; }
  .mp-doc-head .mp-subtitle { margin: 2mm 0 0; font-size: 9.5px; color:#135441; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; }
  .mp-doc-head .mp-meta { margin: 2.5mm 0 0; display:flex; flex-wrap:wrap; justify-content:center; gap: 3mm; font-size:7.2px; color:#5a7169; }
  .mp-doc-head .mp-meta span { display:inline-flex; gap:1.2mm; }
  .mp-doc-head .mp-meta strong { color:#0b3d2e; }
  .mp-doc-head .mp-filters { margin-top: 3mm; padding: 2.5mm 3mm; border-radius: 2mm; background:#f2fcf7; border:1px dashed #cfe3da; font-size:6.8px; color:#4c635a; text-align:left; line-height:1.5; }
  .mp-doc-head .mp-filters b { color:#0b3d2e; }
  .mp-doc-head .mp-note { margin-top:3mm; font-size:6.5px; color:#6c8079; line-height:1.45; }
  
  /* Summary table */
  .mp-summary { margin: 0 0 6mm; border:1px solid #d7e7df; border-radius: 3mm; overflow:hidden; background:#fff; }
  .mp-summary-head { display:flex; justify-content:space-between; align-items:center; gap:3mm; padding: 3mm 4mm; background: linear-gradient(90deg, #0b3d2e 0%, #167055 100%); color:#fff; }
  .mp-summary-head h3 { margin:0; font-size:10px; letter-spacing:0.02em; }
  .mp-summary-head span { font-size:7px; background: rgba(255,255,255,0.18); padding: 1mm 2.5mm; border-radius:999px; }
  .mp-table-wrap { overflow:hidden; }
  .mp-table { width:100%; border-collapse: collapse; font-size: 7px; }
  .mp-table th { background:#f4faf7; color:#3f5a52; font-size:6.5px; text-transform:uppercase; letter-spacing:0.06em; padding: 2mm 2mm; text-align:left; border-bottom:1px solid #d7e7df; white-space:nowrap; }
  .mp-table td { padding: 2mm 2mm; border-bottom:1px solid #e8f0ec; vertical-align:top; line-height:1.35; }
  .mp-table td strong { color:#0b3d2e; font-size:7.2px; }
  .mp-table td small { display:block; color:#6c8079; font-size:6px; margin-top:0.5mm; }
  .mp-table tr:nth-child(even) td { background:#fcfefd; }
  
  /* Member cards */
  .mp-cards { display:grid; gap: 5mm; }
  .mp-card { border:1px solid #cbdcd5; border-radius: 3mm; overflow:hidden; background:#fff; break-inside: avoid; page-break-inside: avoid; box-shadow: 0 1mm 3mm rgba(11,61,46,0.06); }
  .mp-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:3mm; padding: 3.5mm 4mm; background: linear-gradient(135deg, #0b3d2e 0%, #135441 55%, #167055 100%); color:#fff; }
  .mp-card-identity { display:flex; gap:3mm; align-items:flex-start; min-width:0; flex:1; }
  .mp-avatar { width:12mm; height:12mm; border-radius: 2.5mm; background:#fff; color:#0b3d2e; display:grid; place-items:center; font-weight:900; font-size:4.5mm; flex:0 0 12mm; border: 0.6mm solid #c7a547; overflow:hidden; box-shadow: 0 0.5mm 2mm rgba(0,0,0,0.12); }
  .mp-avatar.has-photo { background:#fff; padding:0; }

  .mp-card-title p { margin: 0.8mm 0 0; font-size:6.8px; color:#c9f5dc; line-height:1.35; overflow-wrap:anywhere; }

  .badge-green { background:#dff7e9; color:#0d6c49; border-color:#8eb9a4; }

  .mp-section-head { display:flex; align-items:center; gap:2mm; margin:0 0 2mm; padding-bottom:1.2mm; border-bottom:0.6mm solid #e5c35d; }

  .mp-signatory strong { display:block; font-size:8px; color:#0b3d2e; }
  .mp-signatory span { display:block; font-size:6px; color:#5a7169; text-transform:uppercase; letter-spacing:0.05em; margin-top:1mm; }

  .mp-print-meta b { color:#0b3d2e; }

  .preview-tabs { display:flex; gap:6px; padding:10px 14px; background:#fff; border-bottom:1px solid #dce9e4; }
  .preview-tab { min-height:36px; padding:8px 12px; border-radius:9px; border:1px solid #dce9e4; background:#f7fbf9; font-weight:800; font-size:11px; cursor:pointer; }
  .preview-tab.active { background:#0b3d2e; color:#fff; border-color:#0b3d2e; }

  @media print {
    html, body { background:#fff; }
    .screen-toolbar, .preview-tabs { display:none !important; }
    .preview-stage { padding:0; background:#fff; display:block; }
    .lso-print-document { width:8.5in; box-shadow:none; }
    .lso-print-header { position: fixed; top:0; left:0; right:0; }
    .lso-print-footer { position: fixed; bottom:0; left:0; right:0; margin-top:0; }
    .lso-print-content { margin: 1.05in 0.52in 0.78in 0.52in; padding:0; }
    .mp-card { box-shadow:none; }
  }

  @media (max-width: 920px) {
    .preview-stage { padding: 8px; }
    .lso-print-document { width: 100%; max-width: 8.5in; }
  }
</style>

function safeText(v){ return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    {sec:'Organization Information', lbl:'Current Period Group', val:member.periodGroup},
    {sec:'Organization Information', lbl:'Orchestra Section', val:member.orchestraSection},
    {sec:'Organization Information', lbl:'Primary Instrument', val:member.primaryInstrument},
    {sec:'Organization Information', lbl:'Stage Notes', val:member.stageNotes, full:true},
    {sec:'Membership Timeline', lbl:'Trainee Period Start', val:dateLabel(member.traineeStartDate)},
    {sec:'Membership Timeline', lbl:'Probationary Period Start', val: member.probationarySkipped ? 'Skipped' : dateLabel(member.probationaryStartDate)},
    {sec:'Membership Timeline', lbl:'Probationary Skipped', val: member.probationarySkipped ? 'Yes' : 'No'},
    {sec:'Membership Timeline', lbl:'Membership Period Start', val:dateLabel(member.regularMemberDate)},
    {sec:'Membership Timeline', lbl:'Date Registered', val:dateLabel(member.dateRegistered)},
    {sec:'Membership Timeline', lbl:'Last Profile Review', val:dateLabel(member.lastProfileReview)},
    {sec:'Membership Timeline', lbl:'Review Status', val:member.reviewStatus},
    {sec:'Membership Timeline', lbl:'Record Quality', val: member.recordQuality ? member.recordQuality+'%' : '—'},
    {sec:'Record Notes', lbl:'Remarks / Notes', val:member.remarks, full:true}
  ];
  
  const sections = {};
  fields.forEach(f=>{ if(!sections[f.sec]) sections[f.sec]=[]; sections[f.sec].push(f); });
  const order = ['Personal Information','Academic Information','Organization Information','Membership Timeline','Record Notes'];
  const icons = {'Personal Information':'01','Academic Information':'02','Organization Information':'03','Membership Timeline':'04','Record Notes':'05'};
  
  const sectionsHtml = order.map(sec=>{
    const list = sections[sec]; if(!list) return '';
    return `<div class="mp-section"><div class="mp-section-head"><span>${icons[sec]}</span><h4>${safeText(sec)}</h4></div><div class="mp-field-grid">${list.map(f=>`<div class="mp-field${f.full?' full':''}"><span>${safeText(f.lbl)}</span><strong>${safeText(f.val||'—')}</strong></div>`).join('')}</div></div>`;
  }).join('');
  
  const badgeClass = member.periodGroup==='Membership Period' ? 'badge-green' : member.periodGroup==='Probationary Period' ? 'badge-gold' : 'badge-blue';
  const initials = member.fullName.split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
  
  return `<article class="mp-card">
    <header class="mp-card-header">
      <div class="mp-card-identity">
        <div class="mp-avatar">${safeText(initials)}</div>
        <div class="mp-card-title">
          <h2>${safeText(member.fullName)}</h2>
          <p>${safeText(member.membershipId)} • ${safeText(member.studentNumber)} • ${safeText(member.orchestraSection)} • ${safeText(member.primaryInstrument)}</p>
          <div class="mp-badges">
            <span class="mp-badge ${badgeClass}">${safeText(member.periodGroup)}</span>
            <span class="mp-badge badge-gray">${safeText(member.memberStatus)}</span>
            <span class="mp-badge badge-gray">Quality: ${safeText(member.recordQuality)}%</span>
            <span class="mp-badge badge-gray">${safeText(member.organizationPosition)}${member.organizationRole ? ' • '+safeText(member.organizationRole) : ''}</span>
          </div>
        </div>
      </div>
      <div class="mp-card-index">#${String(i+1).padStart(3,'0')}</div>
    </header>
    <div class="mp-card-body">${sectionsHtml}</div>
  </article>`;
}

function renderStage(stage){
  const members = sampleMembers[stage] || [];
  const today = new Date();
  const dateStr = new Intl.DateTimeFormat('en-PH',{year:'numeric',month:'long',day:'numeric'}).format(today);
  
  const summaryRows = members.map((m,i)=>`<tr><td>${i+1}</td><td><strong>${safeText(m.fullName)}</strong><br><small>${safeText(m.membershipId)} • ${safeText(m.studentNumber)}</small></td><td>${safeText(m.orchestraSection)}<br><small>${safeText(m.primaryInstrument)}</small></td><td>${safeText(m.course||m.college)}<br><small>${safeText(m.yearLevel)} ${safeText(m.section)}</small></td><td>${safeText(m.organizationPosition)}<br><small>${safeText(m.organizationRole)}</small></td><td>${safeText(m.memberStatus)}</td><td>${safeText(m.recordQuality)}%</td></tr>`).join('');
  
  document.getElementById('printContent').innerHTML = `
    <header class="mp-doc-head">
      <h1>LASALLIAN SYMPHONY ORCHESTRA</h1>
      <div class="mp-subtitle">Official Members Directory • ${safeText(stage)} • Short Bond (8.5" x 11")</div>
      <div class="mp-meta">
        <span><strong>Generated:</strong> ${safeText(dateStr)}</span>
        <span><strong>By:</strong> Administrator</span>
        <span><strong>Records:</strong> ${members.length}</span>
        <span><strong>Paper:</strong> Short Bond Letter (215.9mm x 279.4mm)</span>
      </div>
      <div class="mp-filters">
        <b>Filters Applied:</b> Search: None • Status: All • Orchestra Section: All • Position: All<br>
        <b>Scope:</b> ${safeText(stage)} only • ${members.length} member${members.length===1?'':'s'} matched • Sorted by Full Name (A-Z)<br>
        <b>Fields:</b> All information as indicated in System Management (Personal, Academic, Organization, Membership Timeline, Record Notes) including profile photo, quality score, and remarks.<br>
        <b>Paper Size:</b> Short Bond 8.5" x 11" (215.9mm x 279.4mm) — official LSO print with header/footer on every page
      </div>
      <div class="mp-note">This document uses the official LSO header and footer. For borderless professional output, enable <b>Background graphics</b> and set <b>Margins: None</b> in the browser print dialog. The system requests 8.5in x 11in short bond paper.</div>
    </header>

    <section class="mp-summary">
      <div class="mp-summary-head"><h3>Directory Summary • ${safeText(stage)}</h3><span>${members.length} record${members.length===1?'':'s'} • Short Bond</span></div>
      <div class="mp-table-wrap"><table class="mp-table"><thead><tr><th>#</th><th>Member / IDs</th><th>Section / Instrument</th><th>Program / Year</th><th>Organization</th><th>Status</th><th>Quality</th></tr></thead><tbody>${summaryRows}</tbody></table></div>
    </section>

    <section class="mp-cards">
      ${members.map((m,i)=>memberCard(m,i)).join('')}
    </section>

    <section class="mp-signatory">
      <div><div class="mp-sign-line"><strong>Juan Dela Cruz</strong><span>Prepared By / EVP for Membership</span></div></div>
      <div><div class="mp-sign-line"><strong></strong><span>Authorized Officer / President</span></div></div>
    </section>

    <div class="mp-print-meta">
      <b>Lasallian Symphony Orchestra</b> • Official Members Directory • ${safeText(stage)} • Generated ${safeText(dateStr)} • ${members.length} record${members.length===1?'':'s'}<br>
      This is a system-generated document containing all member information as indicated in System Management. Keep confidential.<br>
      Paper: Short Bond (8.5" x 11" / 215.9mm x 279.4mm) • Official Header & Footer • LSO Database System
    </div>
  `;

  document.querySelectorAll('.preview-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.stage===stage);
  });
}

function switchStage(stage){ renderStage(stage); }

renderStage('Membership Period');
</script>

</body>
</html>
