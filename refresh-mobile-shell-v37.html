<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Updating LSO Mobile Layout</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0b3d2e;color:#fff;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,520px);padding:30px;border-radius:24px;background:#fff;color:#17211d;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.25)}.spinner{width:48px;height:48px;margin:0 auto 18px;border:5px solid #d8e2dc;border-top-color:#146c43;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{line-height:1.6;color:#5f6b65}</style>
</head>
<body><main class="card"><div class="spinner"></div><h1>Updating mobile layout</h1><p>Removing the older navigation and scrolling files. The corrected LSO system will open automatically.</p></main>
<script>
(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('lso-website-')).map(k=>caches.delete(k)));}}catch(e){}const target=new URL('./index.html?build=mobile-shell-v37',location.href);setTimeout(()=>location.replace(target.href),900);})();
</script></body></html>
