<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d2e"><title>Updating LSO Mobile Compatibility</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#0b3d2e;color:#fff;min-height:100dvh;display:grid;place-items:center;margin:0;padding:20px}.card{width:min(100%,520px);padding:30px;border:1px solid #d4a017;border-radius:20px;background:#123f32;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}strong{display:block;font-size:1.35rem;margin-bottom:10px}p{line-height:1.55;color:#e3f3eb}</style></head><body><div class="card"><strong>Applying the mobile scrolling fix…</strong><p id="status">Removing older website caches and service workers.</p></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches'in window){const k=await caches.keys();await Promise.all(k.filter(x=>x.startsWith('lso-website-')).map(x=>caches.delete(x)));}try{sessionStorage.removeItem('lso-scroll-position')}catch{}s.textContent='Update complete. Opening the corrected system…';setTimeout(()=>location.replace('./index.html?v=20260729-mobile-scroll-v36'),700);}catch(e){s.textContent='Refresh complete. Opening the corrected system…';setTimeout(()=>location.replace('./index.html?v=20260729-mobile-scroll-v36'),900);}})();</script></body></html>
