<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0B3D2E">
<title>Repair LSO Mobile Cache</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17211D;background:#F6F8F5}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px}main{width:min(540px,100%);padding:30px;border:1px solid #D8E2DC;border-radius:24px;background:#fff;box-shadow:0 22px 55px rgba(5,41,31,.16);text-align:center}h1{margin:0 0 10px;color:#0B3D2E;font-size:26px}p{margin:0;color:#5F6B65;line-height:1.55}.spinner{width:46px;height:46px;margin:0 auto 20px;border:4px solid #DDF4E7;border-top-color:#146C43;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main><div class="spinner" aria-hidden="true"></div><h1>Repairing the LSO mobile app</h1><p id="status">Removing older cached permissions and loading the Staff Duty Hours roster fix…</p></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
   try{sessionStorage.setItem('lso_staff_duty_roster_refresh_v33',String(Date.now()));}catch{}
   status.textContent='Repair complete. Loading the corrected system…';
 }catch(error){status.textContent='Opening the corrected system…';}
 const target='./index.html?build=20260726-staff-duty-roster-v33&force='+Date.now();
 setTimeout(()=>location.replace(target),350);
})();
</script>
</body>
</html>
