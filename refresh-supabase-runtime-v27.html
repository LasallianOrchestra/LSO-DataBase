<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refreshing LSO System</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b3d2e;color:#fff;font:16px/1.5 system-ui,sans-serif}
    main{max-width:34rem;padding:2rem;text-align:center}.spinner{width:48px;height:48px;margin:0 auto 1rem;border:5px solid rgba(255,255,255,.25);border-top-color:#d4a017;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><main><div class="spinner" aria-hidden="true"></div><h1>Applying the LSO update</h1><p id="status">Removing the defective cached cloud module…</p></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('lso-website-')).map(k=>caches.delete(k)));
    }
    try{localStorage.removeItem('lso_pwa_update_seen_v1')}catch{}
    status.textContent='Update applied. Opening the corrected login page…';
  }catch(e){status.textContent='The cache reset completed with a browser limitation. Opening the website…';}
  setTimeout(()=>location.replace('./index.html?v=20260726-supabase-runtime-v27'),900);
})();
</script></body></html>
