<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B3D2E">
  <title>Updating LSO Access Control</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b3d2e;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:24px}
    main{max-width:34rem;padding:2rem;text-align:center;background:#fff;color:#17211d;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
    .spinner{width:48px;height:48px;margin:0 auto 1rem;border:5px solid #d8e2dc;border-top-color:#146c43;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.4rem;margin:.4rem 0}.status{color:#426050}
  </style>
</head>
<body><main>
  <div class="spinner" aria-hidden="true"></div>
  <h1>Applying Access Control V89</h1>
  <p id="status" class="status">Removing cached role and permission modules…</p>
</main>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter((key) => key.startsWith('lso-website-')).map((key) => caches.delete(key)));
    }
    status.textContent = 'Access Control V89 is ready. Opening the website…';
  } catch (error) {
    status.textContent = 'Cache reset completed with a browser limitation. Opening the website…';
  }
  setTimeout(() => location.replace('./index.html?access-control=v89&ts=' + Date.now()), 700);
})();
</script>
</body>
</html>
