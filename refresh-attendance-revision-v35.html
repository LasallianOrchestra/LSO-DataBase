<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updating LSO System</title><style>body{font-family:system-ui;background:#0b3d2e;color:white;min-height:100vh;display:grid;place-items:center;margin:0}.card{max-width:520px;padding:30px;border:1px solid #d4a017;border-radius:20px;background:#123f32;text-align:center}strong{display:block;font-size:1.4rem;margin-bottom:10px}</style></head><body><div class="card"><strong>Applying the Attendance and Duty Hours revision…</strong><p id="status">Removing older website caches and service workers.</p></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches'in window){const k=await caches.keys();await Promise.all(k.filter(x=>x.startsWith('lso-website-')).map(x=>caches.delete(x)));}s.textContent='Update complete. Opening the corrected system…';setTimeout(()=>location.replace('./index.html?v=20260728-attendance-duty-v35'),700);}catch(e){s.textContent='Refresh complete. Opening the system…';setTimeout(()=>location.replace('./index.html?v=20260728-attendance-duty-v35'),900);}})();</script></body></html>
